[package]
name = "open-task-manager"
description = "A free, open source task manager"
version = "0.84.0"
edition = "2024"
license = "GPL-3.0-or-later"

# Each tool with a Rust side can be left out of a build. All are in by
# default; for a smaller build pick the ones you want, for example
# `cargo build --release --no-default-features --features processes,disks`.
# CPU, Memory, GPU and Overview need no feature: the live sampler feeds them.
[features]
default = ["benchmarks", "connections", "disk-space", "disks", "installed-apps", "network", "processes", "security-audit", "sensors", "slowdown", "startup-apps"]
benchmarks = []
connections = []
disk-space = []
disks = []
installed-apps = []
network = []
processes = []
security-audit = []
sensors = []
slowdown = []
startup-apps = []

[lib]
name = "open_task_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.40"
libc = "0.2"
rayon = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
